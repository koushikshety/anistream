name: Auto-Sync Anime & Donghua Catalog (Every 30 Mins)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Official Whitelisted YouTube Episodes
        run: python3 sync_youtube.py

      - name: Sync Global AniList Catalog & Sitemap
        run: |
          if [ -f scripts/auto_sync.py ]; then
            python3 scripts/auto_sync.py
          elif [ -f auto_sync.py ]; then
            python3 auto_sync.py
          fi

      - name: Commit & Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json data/ sitemap.xml catalog.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: automated episode & catalog sync"
          git push
