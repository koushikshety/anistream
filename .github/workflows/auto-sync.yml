- name: Run Catalog, YouTube & Watch-Link Sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/auto_sync.py
          python3 sync_youtube.py
          python3 sync_watch_links.py
          python3 merge_catalog.py

      - name: Commit and Push Updated Catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json episodes.json review_queue.json watch_links.json
          git diff --staged --quiet || git commit -m "Auto-sync catalog ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
