<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniStream — Free Official Anime, Hindi Dubs & Donghua in 1080p HD</title>
  <style>
    :root {
      --bg: #080a0f;
      --surface: #11151f;
      --border: #1e2638;
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --donghua: #f59e0b;
      --accent: #2ed573;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(8, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .brand span { color: var(--primary); }
    .mode-switch { display: flex; gap: 8px; }
    .nav-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn.active-anime { background: var(--primary); border-color: var(--primary); color: #fff; }
    .nav-btn-donghua {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
    }
    .nav-btn-donghua:hover, .nav-btn-donghua.active-donghua {
      background: var(--donghua);
      border-color: var(--donghua);
      color: #080a0f;
    }
    .search-box { flex: 1; min-width: 200px; max-width: 340px; }
    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      outline: none;
    }
    .hero {
      position: relative;
      min-height: 380px;
      display: flex;
      align-items: flex-end;
      padding: 34px 20px;
      background-size: cover;
      background-position: center;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 8%, rgba(8,10,15,0.68) 55%, rgba(8,10,15,0.3) 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 680px; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .badge-hd { background: rgba(46, 213, 115, 0.18); color: var(--accent); border: 1px solid rgba(46, 213, 115, 0.4); }
    .badge-dub { background: rgba(255, 71, 87, 0.2); color: #ff8a95; border: 1px solid rgba(255, 71, 87, 0.4); }
    .badge-donghua { background: rgba(245, 158, 11, 0.22); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.15; margin-bottom: 10px; }
    .hero p { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-watch {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff; text-decoration: none;
      font-weight: 700; padding: 11px 22px; border-radius: 8px;
    }
    .btn-donghua-hero {
      background: rgba(245, 158, 11, 0.18); border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24; font-weight: 700; padding: 11px 18px; border-radius: 8px; cursor: pointer;
    }
    .main { max-width: 1320px; margin: 0 auto; padding: 12px 20px 48px; }
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-pill {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 15px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-pill[data-filter="donghua"].active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }
    .section-title { font-size: 1.15rem; font-weight: 700; margin: 24px 0 14px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ""; width: 4px; height: 18px; background: var(--primary); border-radius: 4px; }
    .section-title.donghua-accent::before { background: var(--donghua); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; text-decoration: none; color: inherit; transition: 0.2s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .card.donghua-card:hover { border-color: var(--donghua); }
    .poster-wrap { position: relative; aspect-ratio: 2 / 3; background: #161b26; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tag-top {
      position: absolute; top: 8px; left: 8px; background: rgba(8, 10, 15, 0.85);
      color: var(--accent); font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .tag-bottom {
      position: absolute; bottom: 8px; right: 8px; background: var(--primary);
      color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .tag-bottom.tag-donghua { background: var(--donghua); color: #080a0f; }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand" onclick="switchMode('all'); return false;">ANI<span>STREAM</span></a>
      <div class="mode-switch">
        <button id="btn-mode-anime" class="nav-btn active-anime" onclick="switchMode('anime')">Anime</button>
        <button id="btn-mode-donghua" class="nav-btn nav-btn-donghua" onclick="switchMode('donghua')">🐉 Donghua</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search anime, Hindi dub, donghua..." />
    </div>
  </header>

  <section class="hero" id="hero-banner">
    <div class="hero-content">
      <div class="badge-row">
        <span class="badge badge-hd" id="hero-quality">1080p Official</span>
        <span class="badge badge-dub" id="hero-audio">Sub & Hindi Dub</span>
      </div>
      <h1 id="hero-title">Loading Catalog...</h1>
      <p id="hero-desc"></p>
      <div class="hero-actions">
        <a href="#" id="hero-cta" class="btn-watch">▶ Watch Free Now</a>
        <button class="btn-donghua-hero" onclick="switchMode('donghua')">🐉 Watch Donghua</button>
      </div>
    </div>
  </section>

  <main class="main">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-pill active" data-filter="all">All Catalog</button>
      <button class="filter-pill" data-filter="anime">Japanese Anime</button>
      <button class="filter-pill" data-filter="donghua">🐉 Donghua</button>
      <button class="filter-pill" data-filter="hindi">Hindi Dub</button>
      <button class="filter-pill" data-filter="action">Action</button>
      <button class="filter-pill" data-filter="isekai">Isekai / Cultivation</button>
    </div>

    <div id="continue-section" style="display:none;">
      <h2 class="section-title">Continue Watching</h2>
      <div class="grid" id="continue-grid"></div>
    </div>

    <h2 class="section-title" id="catalog-heading">All Free Official Streams (1080p–4K)</h2>
    <div class="grid" id="anime-grid"></div>
  </main>

  <script>
    let CATALOG = [];

    function setHero(item) {
      if (!item) return;
      const isDonghua = item.type === "donghua";
      document.getElementById("hero-banner").style.backgroundImage = `url('${item.banner || item.cover}')`;
      document.getElementById("hero-title").textContent = item.title;
      document.getElementById("hero-desc").textContent = item.desc;
      document.getElementById("hero-quality").textContent = `${item.quality} Official`;
      const audioBadge = document.getElementById("hero-audio");
      audioBadge.className = `badge ${isDonghua ? "badge-donghua" : "badge-dub"}`;
      audioBadge.textContent = isDonghua ? "DONGHUA • OFFICIAL" : (item.hasHindi ? "SUB + HINDI DUB" : "ENGLISH SUB");
      document.getElementById("hero-cta").href = `watch.html?id=${item.slug}`;
    }

    function renderGrid(list) {
      const grid = document.getElementById("anime-grid");
      grid.innerHTML = list.map(item => {
        const isDonghua = item.type === "donghua";
        const bottomTag = isDonghua
          ? `<span class="tag-bottom tag-donghua">DONGHUA</span>`
          : (item.hasHindi ? `<span class="tag-bottom">HINDI</span>` : `<span class="tag-bottom">SUB</span>`);
        return `
          <a class="card ${isDonghua ? "donghua-card" : ""}" href="watch.html?id=${item.slug}">
            <div class="poster-wrap">
              <img src="${item.cover}" alt="${item.title}" loading="lazy" />
              <span class="tag-top">${item.quality}</span>
              ${bottomTag}
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-meta">${item.episodes} Eps • ${item.provider}</div>
            </div>
          </a>
        `;
      }).join("");
    }

    function switchMode(mode) {
      const animeBtn = document.getElementById("btn-mode-anime");
      const donghuaBtn = document.getElementById("btn-mode-donghua");
      const heading = document.getElementById("catalog-heading");

      animeBtn.classList.remove("active-anime");
      donghuaBtn.classList.remove("active-donghua");
      heading.classList.remove("donghua-accent");

      document.querySelectorAll(".filter-pill").forEach(p => {
        p.classList.toggle("active", p.dataset.filter === mode);
      });

      if (mode === "donghua") {
        donghuaBtn.classList.add("active-donghua");
        heading.classList.add("donghua-accent");
        heading.textContent = "🐉 Official Donghua Streams (1080p–4K)";
        const list = CATALOG.filter(i => i.type === "donghua");
        setHero(list[0]);
        renderGrid(list);
      } else if (mode === "anime") {
        animeBtn.classList.add("active-anime");
        heading.textContent = "Free Official Anime Streams (1080p)";
        const list = CATALOG.filter(i => i.type === "anime");
        setHero(list[0]);
        renderGrid(list);
      } else {
        animeBtn.classList.add("active-anime");
        heading.textContent = "All Free Official Streams (1080p–4K)";
        setHero(CATALOG[0]);
        renderGrid(CATALOG);
      }
    }

    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem("anistream_history") || "[]");
      if (!history.length) return;
      document.getElementById("continue-section").style.display = "block";
      document.getElementById("continue-grid").innerHTML = history.slice(0, 6).map(h => `
        <a class="card" href="watch.html?id=${h.slug}&ep=${h.episode}">
          <div class="poster-wrap">
            <img src="${h.cover}" alt="${h.title}" loading="lazy" />
            <span class="tag-top">EP ${h.episode}</span>
            <span class="tag-bottom">RESUME</span>
          </div>
          <div class="card-body">
            <div class="card-title">${h.title}</div>
            <div class="card-meta">Episode ${h.episode} • ${h.track || "Sub"}</div>
          </div>
        </a>
      `).join("");
    }

    document.getElementById("filter-bar").addEventListener("click", (e) => {
      if (!e.target.classList.contains("filter-pill")) return;
      const filter = e.target.dataset.filter;
      if (filter === "donghua" || filter === "anime" || filter === "all") {
        switchMode(filter);
        return;
      }
      document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      renderGrid(CATALOG.filter(a => a.genres.includes(filter)));
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderGrid(CATALOG.filter(a =>
        a.title.toLowerCase().includes(q) || a.provider.toLowerCase().includes(q)
      ));
    });

    fetch("data/catalog.json")
      .then(res => res.json())
      .then(data => {
        CATALOG = data;
        setHero(CATALOG[0]);
        renderContinueWatching();
        renderGrid(CATALOG);
      });
  </script>
</body>
</html>
