<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniStream — Watch Free Official Anime, Hindi Dubs & 4K Donghua</title>
  <style>
    :root {
      --bg: #080a0f; --surface: #11151f; --surface-2: #181e2c; --border: #1e2638;
      --primary: #ff4757; --donghua: #f59e0b; --accent: #2ed573;
      --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 12px 20px; background: rgba(8,10,15,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .brand span { color: var(--primary); }
    .mode-switch { display: flex; gap: 8px; }
    .nav-btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .nav-btn.active-anime { background: var(--primary); border-color: var(--primary); color: #fff; }
    .nav-btn-donghua { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.14); color: #fbbf24; }
    .nav-btn-donghua:hover, .nav-btn-donghua.active-donghua { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }

    .search-box { flex: 1; min-width: 210px; max-width: 360px; }
    .search-box input {
      width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }

    /* Hero Banner */
    .hero {
      position: relative; min-height: 360px; display: flex; align-items: flex-end;
      padding: 36px 20px; background-size: cover; background-position: center 25%;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg) 6%, rgba(8,10,15,0.72) 55%, rgba(8,10,15,0.28) 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 700px; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .badge-hd { background: rgba(46,213,115,0.18); color: var(--accent); border: 1px solid rgba(46,213,115,0.4); }
    .badge-dub { background: rgba(255,71,87,0.2); color: #ff8a95; border: 1px solid rgba(255,71,87,0.4); }
    .badge-donghua { background: rgba(245,158,11,0.22); color: #fbbf24; border: 1px solid rgba(245,158,11,0.45); }
    .badge-year { background: rgba(255,255,255,0.12); color: #e2e8f0; }

    .hero h1 { font-size: clamp(1.55rem, 4vw, 2.45rem); line-height: 1.15; margin-bottom: 10px; }
    .hero p { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-watch {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff; text-decoration: none;
      font-weight: 700; padding: 11px 22px; border-radius: 8px;
    }
    .btn-donghua-hero {
      background: rgba(245,158,11,0.18); border: 1px solid rgba(245,158,11,0.5);
      color: #fbbf24; font-weight: 700; padding: 11px 18px; border-radius: 8px; cursor: pointer;
    }

    .main { max-width: 1340px; margin: 0 auto; padding: 14px 20px 56px; }
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; scrollbar-width: none; }
    .filter-pill {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 15px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-pill[data-filter="donghua"].active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }

    .section-title { font-size: 1.15rem; font-weight: 700; margin: 22px 0 14px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ""; width: 4px; height: 18px; background: var(--primary); border-radius: 4px; }
    .section-title.donghua-accent::before { background: var(--donghua); }

    /* Responsive Card Grid (2 cols on small mobile, 3 on tablet, 5-6 on desktop) */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; text-decoration: none; color: inherit; transition: 0.2s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .card.donghua-card:hover { border-color: var(--donghua); }

    /* True 2:3 Portrait Poster Container with Top-Center Face Alignment */
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2 / 3; background: #141925; overflow: hidden; }
    .poster-wrap img {
      width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block;
    }
    .tag-top {
      position: absolute; top: 8px; left: 8px; background: rgba(8,10,15,0.86);
      color: var(--accent); font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .tag-score {
      position: absolute; top: 8px; right: 8px; background: rgba(8,10,15,0.86);
      color: #fbbf24; font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .tag-bottom {
      position: absolute; bottom: 8px; right: 8px; background: var(--primary);
      color: #fff; font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .tag-bottom.tag-donghua { background: var(--donghua); color: #080a0f; }

    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title {
      font-size: 0.88rem; font-weight: 700; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { font-size: 0.74rem; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }

    /* Safe, Non-Intrusive Adsterra Monetization Containers */
    .ad-zone {
      margin: 20px 0; padding: 10px; border-radius: 10px;
      background: rgba(17, 21, 31, 0.55); border: 1px dashed rgba(148, 163, 184, 0.18);
      text-align: center; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ad-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand" onclick="switchMode('all'); return false;">ANI<span>STREAM</span></a>
      <div class="mode-switch">
        <button id="btn-mode-anime" class="nav-btn active-anime" onclick="switchMode('anime')">Anime</button>
        <button id="btn-mode-donghua" class="nav-btn nav-btn-donghua" onclick="switchMode('donghua')">🐉 Donghua</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search English, native title, year, Hindi..." />
    </div>
  </header>

  <section class="hero" id="hero-banner">
    <div class="hero-content">
      <div class="badge-row">
        <span class="badge badge-hd" id="hero-quality">1080p Official</span>
        <span class="badge badge-year" id="hero-year">2024</span>
        <span class="badge badge-dub" id="hero-audio">Sub & Hindi Dub</span>
      </div>
      <h1 id="hero-title">Loading Catalog...</h1>
      <p id="hero-desc"></p>
      <div class="hero-actions">
        <a href="#" id="hero-cta" class="btn-watch">▶ Watch Free Now</a>
        <button class="btn-donghua-hero" onclick="switchMode('donghua')">🐉 Watch Donghua</button>
      </div>
    </div>
  </section>

  <main class="main">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-pill active" data-filter="all">All Catalog</button>
      <button class="filter-pill" data-filter="anime">Japanese Anime</button>
      <button class="filter-pill" data-filter="donghua">🐉 Donghua</button>
      <button class="filter-pill" data-filter="hindi">Hindi Dub</button>
      <button class="filter-pill" data-filter="action">Action</button>
      <button class="filter-pill" data-filter="isekai">Fantasy / Cultivation</button>
    </div>

    <!-- Safe Top Native Ad Slot (Paste Adsterra Native Banner Script Inside) -->
    <div class="ad-zone" id="ad-home-top">
      <span class="ad-label">Sponsored</span>
      <div id="container-adsterra-home-top"></div>
    </div>

    <div id="continue-section" style="display:none;">
      <h2 class="section-title">Continue Watching</h2>
      <div class="grid" id="continue-grid"></div>
    </div>

    <h2 class="section-title" id="catalog-heading">All Free Official Streams (1080p–4K)</h2>
    <div class="grid" id="anime-grid"></div>

    <!-- Safe Bottom Native Ad Slot -->
    <div class="ad-zone" id="ad-home-bottom">
      <span class="ad-label">Sponsored</span>
      <div id="container-adsterra-home-bottom"></div>
    </div>
  </main>

  <script>
    let CATALOG = [];

    function setHero(item) {
      if (!item) return;
      const isDonghua = item.type === "donghua";
      document.getElementById("hero-banner").style.backgroundImage = `url('${item.banner || item.cover}')`;
      document.getElementById("hero-title").textContent = item.title;
      document.getElementById("hero-year").textContent = item.year || "HD";
      document.getElementById("hero-desc").textContent = item.desc;
      document.getElementById("hero-quality").textContent = `${item.quality} Official`;
      const audioBadge = document.getElementById("hero-audio");
      audioBadge.className = `badge ${isDonghua ? "badge-donghua" : "badge-dub"}`;
      audioBadge.textContent = isDonghua ? "DONGHUA • OFFICIAL" : (item.hasHindi ? "SUB + HINDI DUB" : "ENGLISH SUB");
      document.getElementById("hero-cta").href = `watch.html?id=${item.slug}`;
    }

    function renderGrid(list) {
      document.getElementById("anime-grid").innerHTML = list.map(item => {
        const isDonghua = item.type === "donghua";
        const bottomTag = isDonghua
          ? `<span class="tag-bottom tag-donghua">DONGHUA</span>`
          : (item.hasHindi ? `<span class="tag-bottom">HINDI</span>` : `<span class="tag-bottom">SUB</span>`);
        const srvCount = (item.servers || []).length;
        return `
          <a class="card ${isDonghua ? "donghua-card" : ""}" href="watch.html?id=${item.slug}">
            <div class="poster-wrap">
              <img src="${item.cover}" alt="${item.title}" loading="lazy" />
              <span class="tag-top">${item.quality}</span>
              <span class="tag-score">★ ${(item.score / 10).toFixed(1)}</span>
              ${bottomTag}
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-meta">
                <span>${item.year || ""} • ${item.episodes} Eps</span>
                <span>${srvCount} Server${srvCount > 1 ? "s" : ""}</span>
              </div>
            </div>
          </a>
        `;
      }).join("");
    }

    function switchMode(mode) {
      const animeBtn = document.getElementById("btn-mode-anime");
      const donghuaBtn = document.getElementById("btn-mode-donghua");
      const heading = document.getElementById("catalog-heading");
      animeBtn.classList.remove("active-anime");
      donghuaBtn.classList.remove("active-donghua");
      heading.classList.remove("donghua-accent");
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.toggle("active", p.dataset.filter === mode));

      if (mode === "donghua") {
        donghuaBtn.classList.add("active-donghua");
        heading.classList.add("donghua-accent");
        heading.textContent = "🐉 Official Donghua Streams (1080p–4K)";
        const list = CATALOG.filter(i => i.type === "donghua");
        setHero(list[0]); renderGrid(list);
      } else if (mode === "anime") {
        animeBtn.classList.add("active-anime");
        heading.textContent = "Free Official Anime Streams (1080p)";
        const list = CATALOG.filter(i => i.type === "anime");
        setHero(list[0]); renderGrid(list);
      } else {
        animeBtn.classList.add("active-anime");
        heading.textContent = "All Free Official Streams (1080p–4K)";
        setHero(CATALOG[0]); renderGrid(CATALOG);
      }
    }

    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem("anistream_history") || "[]");
      if (!history.length) return;
      document.getElementById("continue-section").style.display = "block";
      document.getElementById("continue-grid").innerHTML = history.slice(0, 6).map(h => `
        <a class="card" href="watch.html?id=${h.slug}&ep=${h.episode}">
          <div class="poster-wrap">
            <img src="${h.cover}" alt="${h.title}" loading="lazy" />
            <span class="tag-top">EP ${h.episode}</span>
            <span class="tag-bottom">RESUME</span>
          </div>
          <div class="card-body">
            <div class="card-title">${h.title}</div>
            <div class="card-meta"><span>Episode ${h.episode}</span><span>${h.track || "HD"}</span></div>
          </div>
        </a>
      `).join("");
    }

    document.getElementById("filter-bar").addEventListener("click", (e) => {
      if (!e.target.classList.contains("filter-pill")) return;
      const filter = e.target.dataset.filter;
      if (["donghua", "anime", "all"].includes(filter)) { switchMode(filter); return; }
      document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      renderGrid(CATALOG.filter(a => a.genres.includes(filter)));
    });

    // Search works on English title, Native Chinese/Japanese title, AND Release Year!
    document.getElementById("search-input").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderGrid(CATALOG.filter(a =>
        a.title.toLowerCase().includes(q) ||
        (a.nativeTitle && a.nativeTitle.toLowerCase().includes(q)) ||
        String(a.year).includes(q)
      ));
    });

    fetch("data/catalog.json").then(r => r.json()).then(data => {
      CATALOG = data;
      setHero(CATALOG[0]);
      renderContinueWatching();
      renderGrid(CATALOG);
    });
  </script>
</body>
</html>
