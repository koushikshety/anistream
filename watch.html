<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Free Official Anime & Donghua HD — AniStream</title>
  <style>
    :root {
      --bg: #080a0f; --surface: #11151f; --surface-2: #181e2c; --border: #1e2638;
      --primary: #ff4757; --donghua: #f59e0b; --accent: #2ed573;
      --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: rgba(8,10,15,0.94); border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 1.3rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .brand span { color: var(--primary); }
    .back-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600;
    }
    .container { max-width: 1340px; margin: 0 auto; padding: 16px 20px 56px; }
    .watch-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 920px) { .watch-grid { grid-template-columns: 1fr; } }

    .video-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
      transition: all 0.25s ease;
    }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* Floating Cinema Mode Header & Cancel Button */
    .cinema-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 120;
      padding: 12px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
      justify-content: space-between; align-items: center;
    }
    .cinema-title { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; }
    .cinema-exit-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 8px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 16px rgba(255,71,87,0.45);
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* Full Theater Cinema Mode Experience */
    body.cinema { overflow: hidden; }
    body.cinema .cinema-bar { display: flex; }
    .cinema-backdrop {
      display: none; position: fixed; inset: 0; background: #000; z-index: 100;
    }
    body.cinema .cinema-backdrop { display: block; }
    body.cinema .video-wrap {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 155vh); padding-top: 0; height: min(56.25vw, 82vh);
      z-index: 110; border-radius: 0; border: none;
    }
    body.cinema .cinema-controls {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 120; display: flex; gap: 10px; background: rgba(17,21,31,0.9);
      padding: 8px 14px; border-radius: 999px; border: 1px solid #2a344a;
    }
    .cinema-controls { display: none; }

    /* Multi-Server & Controls Panel */
    .server-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; margin-top: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .server-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .server-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--muted); min-width: 72px; }
    .pill {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pill.donghua-active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }
    .pill-ext { border-color: rgba(46,213,115,0.4); color: var(--accent); }

    /* Safe Non-Overlapping Ad Slot Below Controls */
    .ad-zone {
      margin: 18px 0; padding: 10px; border-radius: 10px;
      background: rgba(17,21,31,0.55); border: 1px dashed rgba(148,163,184,0.18);
      text-align: center; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ad-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }

    .info-card {
      display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .info-card img { width: 100px; aspect-ratio: 2 / 3; object-fit: cover; object-position: center top; border-radius: 8px; flex-shrink: 0; }
    .info-card h1 { font-size: 1.25rem; line-height: 1.25; }
    .native-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .meta-line { font-size: 0.82rem; color: var(--accent); font-weight: 700; margin: 6px 0; }
    .desc-text { font-size: 0.86rem; color: #cbd5e1; }

    .ep-sidebar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; max-height: 600px; overflow-y: auto;
    }
    .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ep-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ep-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 10px 4px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
    }
    .ep-btn:hover, .ep-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .ep-btn.donghua-ep.active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">ANI<span>STREAM</span></a>
    <a href="index.html" class="back-btn">← All Catalog</a>
  </header>

  <!-- Cinema Mode Backdrop & Floating Top/Bottom Controls -->
  <div class="cinema-backdrop" onclick="toggleCinema(false)"></div>
  <div class="cinema-bar">
    <span class="cinema-title" id="cinema-now-playing">Cinema Mode</span>
    <button class="cinema-exit-btn" onclick="toggleCinema(false)">✕ Exit Cinema</button>
  </div>
  <div class="cinema-controls">
    <button class="pill" onclick="prevEpisode()">⏮ Prev Ep</button>
    <button class="pill" onclick="nextEpisode()">Next Ep ⏭</button>
    <button class="pill active" onclick="toggleCinema(false)">✕ Cancel</button>
  </div>

  <main class="container">
    <div class="watch-grid">
      <div>
        <div class="video-wrap">
          <iframe
            id="player-frame"
            src=""
            title="Official Stream Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="server-panel">
          <div class="server-row">
            <span class="server-label">Servers:</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;" id="server-pills"></div>
          </div>
          <div class="server-row" id="official-ext-row" style="display:none;">
            <span class="server-label">Official:</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;" id="ext-pills"></div>
          </div>
          <div class="server-row">
            <span class="server-label">Player:</span>
            <button class="pill" onclick="prevEpisode()">⏮ Prev</button>
            <button class="pill" onclick="nextEpisode()">Next ⏭</button>
            <button class="pill" onclick="toggleCinema(true)">🎬 Cinema Mode</button>
          </div>
        </div>

        <!-- Safe Adsterra Slot (Zero iframe overlap) -->
        <div class="ad-zone">
          <span class="ad-label">Sponsored</span>
          <div id="container-1670e3305650d4a06781e47abce47301"></div>
          <script>
            setTimeout(function() {
              var s = document.createElement("script");
              s.async = true;
              s.setAttribute("data-cfasync", "false");
              s.src = "https://bauval.org/21/1670e3305650d4a06781e47abce47301";
              document.body.appendChild(s);
            }, 1000);
        
    function epKey() { return `anistream_chat_${currentShow ? currentShow.slug : 'show'}_ep${currentEp}`; }
    function loadEpisodeSocial() {
      const lbl = document.getElementById("ep-chat-label");
      if (lbl) lbl.textContent = `Episode ${currentEp}`;
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      ["fire","cry","mind","fight","laugh"].forEach(k => {
        const el = document.getElementById("r-" + k);
        if (el) el.textContent = state.r[k] || 0;
      });
      const list = document.getElementById("comments-list");
      if (list) {
        list.innerHTML = state.c.length
          ? state.c.map(c => `<div style="background:var(--surface-2);padding:8px 10px;border-radius:8px;font-size:0.82rem;"><strong style="color:var(--accent);">${c.name}</strong> <span style="color:var(--muted);font-size:0.7rem;">• ${c.time}</span><div style="margin-top:2px;">${c.text}</div></div>`).join("")
          : `<div style="color:var(--muted);font-size:0.8rem;">Be the first to share your reaction for Episode ${currentEp}!</div>`;
      }
    }
    function reactEp(k) {
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      state.r[k] = (state.r[k] || 0) + 1;
      localStorage.setItem(epKey(), JSON.stringify(state));
      loadEpisodeSocial();
    }
    function postComment() {
      const name = (document.getElementById("comment-name").value || "Anime Fan").trim();
      const inp = document.getElementById("comment-text");
      const text = inp.value.trim();
      if (!text) return;
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      state.c.unshift({ name, text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
      localStorage.setItem(epKey(), JSON.stringify(state));
      inp.value = "";
      loadEpisodeSocial();
    }

  </script>
        </div>

        <div class="info-card">
          <img id="show-cover" src="" alt="Poster" />
          <div>
            <h1 id="show-title">Loading...</h1>
            <div class="native-sub" id="show-native"></div>
            <div class="meta-line" id="show-meta">Official Stream • 1080p</div>
            <p class="desc-text" id="show-desc"></p>
          </div>
        </div>
        <div class="info-card" style="flex-direction:column; margin-top:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <strong>💬 Episode Reactions & Viewer Chat</strong>
            <span id="ep-chat-label" style="font-size:0.78rem; color:var(--muted);">Episode 1</span>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;" id="reaction-bar">
            <button class="pill" onclick="reactEp('fire')">🔥 Hyped (<span id="r-fire">0</span>)</button>
            <button class="pill" onclick="reactEp('cry')">😭 Emotional (<span id="r-cry">0</span>)</button>
            <button class="pill" onclick="reactEp('mind')">🤯 Twist (<span id="r-mind">0</span>)</button>
            <button class="pill" onclick="reactEp('fight')">⚔️ Epic (<span id="r-fight">0</span>)</button>
            <button class="pill" onclick="reactEp('laugh')">😂 Funny (<span id="r-laugh">0</span>)</button>
          </div>
          <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input id="comment-name" placeholder="Your name" style="width:110px; background:var(--surface-2); border:1px solid var(--border); color:#fff; padding:8px 10px; border-radius:8px; font-size:0.82rem;" />
            <input id="comment-text" placeholder="Share your reaction to this episode..." style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:#fff; padding:8px 12px; border-radius:8px; font-size:0.82rem;" onkeydown="if(event.key==='Enter') postComment()" />
            <button class="pill active" onclick="postComment()">Post</button>
          </div>
          <div id="comments-list" style="display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto;"></div>
        </div>
      </div>

      <aside class="ep-sidebar">
        <div class="ep-header">
          <strong>Episodes</strong>
          <select id="ep-range" onchange="renderEpisodes()" style="background:var(--surface-2); color:var(--text); border:1px solid #2a344a; border-radius:6px; padding:4px 8px; font-size:0.8rem; font-weight:700;"></select>
        </div>
        <div class="ep-grid" id="ep-grid"></div>
      </aside>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");
    let currentEp = Math.max(1, Number(params.get("ep")) || 1);
    let currentShow = null;
    let activeServerIdx = 0;

    function toggleCinema(state) {
      document.body.classList.toggle("cinema", state);
      if (currentShow) {
        document.getElementById("cinema-now-playing").textContent = `${currentShow.title} — Episode ${currentEp}`;
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") toggleCinema(false);
    });

    function saveHistory() {
      if (!currentShow) return;
      const srv = currentShow.servers[activeServerIdx] || {};
      let history = JSON.parse(localStorage.getItem("anistream_history") || "[]");
      history = history.filter(item => item.slug !== currentShow.slug);
      history.unshift({
        slug: currentShow.slug,
        title: currentShow.title,
        cover: currentShow.cover,
        episode: currentEp,
        track: srv.lang || "HD"
      });
      localStorage.setItem("anistream_history", JSON.stringify(history.slice(0, 12)));
    }

    function playEpisode(ep) {
      if (!currentShow) return;
      currentEp = ep;
      const srv = currentShow.servers[activeServerIdx];
      if (!srv) return;
      const url = `https://www.youtube-nocookie.com/embed/videoseries?list=${srv.playlistId}&index=${ep - 1}&rel=0&modestbranding=1`;
      document.getElementById("player-frame").src = url;
      document.getElementById("cinema-now-playing").textContent = `${currentShow.title} — Episode ${currentEp}`;
      saveHistory();
      renderEpisodes();
      if (typeof loadEpisodeSocial === "function") loadEpisodeSocial();
    }

    function prevEpisode() { if (currentEp > 1) playEpisode(currentEp - 1); }
    function nextEpisode() { if (currentShow && currentEp < currentShow.episodes) playEpisode(currentEp + 1); }

    function renderServers() {
      const box = document.getElementById("server-pills");
      const isDonghua = currentShow.type === "donghua";
      box.innerHTML = (currentShow.servers || []).map((srv, idx) => {
        const activeClass = idx === activeServerIdx ? (isDonghua ? "donghua-active" : "active") : "";
        return `<button class="pill ${activeClass}" onclick="switchServer(${idx})">▶ ${srv.name}</button>`;
      }).join("");

      const extLinks = currentShow.officialLinks || [];
      if (extLinks.length) {
        document.getElementById("official-ext-row").style.display = "flex";
        document.getElementById("ext-pills").innerHTML = extLinks.map(l =>
          `<a class="pill pill-ext" href="${l.url}" target="_blank" rel="noopener">↗ ${l.site}</a>`
        ).join("");
      }
    }

    function switchServer(idx) {
      activeServerIdx = idx;
      renderServers();
      initRanges();
      playEpisode(currentEp);
    }

    function initRanges() {
      const sel = document.getElementById("ep-range");
      const total = currentShow.episodes || 24;
      const step = 50;
      let opts = "";
      for (let start = 1; start <= total; start += step) {
        const end = Math.min(total, start + step - 1);
        const selected = (currentEp >= start && currentEp <= end) ? "selected" : "";
        opts += `<option value="${start}-${end}" ${selected}>${start}–${end} (${total})</option>`;
      }
      sel.innerHTML = opts;
    }

    function renderEpisodes() {
      const grid = document.getElementById("ep-grid");
      const isDonghua = currentShow.type === "donghua";
      const rangeVal = document.getElementById("ep-range").value || `1-${Math.min(50, currentShow.episodes)}`;
      const [start, end] = rangeVal.split("-").map(Number);
      let html = "";
      for (let i = start; i <= end; i++) {
        const active = i === currentEp ? "active" : "";
        html += `<button class="ep-btn ${isDonghua ? "donghua-ep" : ""} ${active}" onclick="playEpisode(${i})">${i}</button>`;
      }
      grid.innerHTML = html;
    }

    fetch("data/catalog.json").then(r => r.json()).then(list => {
      currentShow = list.find(x => x.slug === slug) || list[0];
      document.title = `Watch ${currentShow.title} (${currentShow.year}) Free HD — AniStream`;
      document.getElementById("show-cover").src = currentShow.cover;
      document.getElementById("show-title").textContent = `${currentShow.title} (${currentShow.year})`;
      document.getElementById("show-native").textContent = currentShow.nativeTitle ? `Original Title: ${currentShow.nativeTitle}` : "";
      document.getElementById("show-meta").textContent = `${currentShow.quality} Official • ★ ${(currentShow.score / 10).toFixed(1)} • ${currentShow.episodes} Episodes`;
      document.getElementById("show-desc").textContent = currentShow.desc;
      renderServers();
      initRanges();
      playEpisode(currentEp);
    });

    function epKey() { return `anistream_chat_${currentShow ? currentShow.slug : 'show'}_ep${currentEp}`; }
    function loadEpisodeSocial() {
      const lbl = document.getElementById("ep-chat-label");
      if (lbl) lbl.textContent = `Episode ${currentEp}`;
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      ["fire","cry","mind","fight","laugh"].forEach(k => {
        const el = document.getElementById("r-" + k);
        if (el) el.textContent = state.r[k] || 0;
      });
      const list = document.getElementById("comments-list");
      if (list) {
        list.innerHTML = state.c.length
          ? state.c.map(c => `<div style="background:var(--surface-2);padding:8px 10px;border-radius:8px;font-size:0.82rem;"><strong style="color:var(--accent);">${c.name}</strong> <span style="color:var(--muted);font-size:0.7rem;">• ${c.time}</span><div style="margin-top:2px;">${c.text}</div></div>`).join("")
          : `<div style="color:var(--muted);font-size:0.8rem;">Be the first to share your reaction for Episode ${currentEp}!</div>`;
      }
    }
    function reactEp(k) {
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      state.r[k] = (state.r[k] || 0) + 1;
      localStorage.setItem(epKey(), JSON.stringify(state));
      loadEpisodeSocial();
    }
    function postComment() {
      const name = (document.getElementById("comment-name").value || "Anime Fan").trim();
      const inp = document.getElementById("comment-text");
      const text = inp.value.trim();
      if (!text) return;
      const state = JSON.parse(localStorage.getItem(epKey()) || '{"r":{"fire":3,"cry":1,"mind":2,"fight":4,"laugh":1},"c":[]}');
      state.c.unshift({ name, text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
      localStorage.setItem(epKey(), JSON.stringify(state));
      inp.value = "";
      loadEpisodeSocial();
    }

  </script>
  <script data-cfasync="false" src="https://bauval.org/14/e2908a73c63d8d2754e40ea99e7cdbda"></script>
</body>
</html>
