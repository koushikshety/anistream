<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Free Official Anime & Donghua HD — AniStream</title>
  <style>
    :root {
      --bg: #080a0f; --surface: #11151f; --surface-2: #181e2c; --border: #1e2638;
      --primary: #ff4757; --donghua: #f59e0b; --accent: #2ed573;
      --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; overflow-x: hidden; }

    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(8,10,15,0.96); border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 1.35rem; font-weight: 900; color: var(--text); text-decoration: none; }
    .brand span { color: var(--primary); }
    .back-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.84rem; font-weight: 700;
    }

    .container { max-width: 1080px; margin: 0 auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 16px; }

    /* Branded AniStream Player Frame */
    .player-shell {
      border-radius: 14px; padding: 3px;
      background: linear-gradient(135deg, var(--primary), #6366f1, var(--donghua));
      box-shadow: 0 12px 36px rgba(0,0,0,0.65);
    }
    .player-header {
      background: #0c1018; padding: 8px 14px; border-radius: 11px 11px 0 0;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 800;
    }
    .player-brand-tag { color: var(--text); letter-spacing: 0.04em; }
    .player-brand-tag span { color: var(--primary); }
    .video-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      background: #000; border-radius: 0 0 11px 11px; overflow: hidden;
    }
    .video-wrap iframe, #artplayer-box { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* Cinema Mode */
    .cinema-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 120;
      padding: 12px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
      justify-content: space-between; align-items: center;
    }
    .cinema-title { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; }
    .cinema-exit-btn {
      background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    body.cinema { overflow: hidden; }
    body.cinema .cinema-bar { display: flex; }
    .cinema-backdrop { display: none; position: fixed; inset: 0; background: #000; z-index: 100; }
    body.cinema .cinema-backdrop { display: block; }
    body.cinema .video-wrap {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 158vh); padding-top: 0; height: min(56.25vw, 84vh);
      z-index: 110; border-radius: 0;
    }
    body.cinema .cinema-controls {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 120; display: flex; gap: 10px; background: rgba(17,21,31,0.92);
      padding: 8px 14px; border-radius: 999px; border: 1px solid #2a344a;
    }
    .cinema-controls { display: none; }

    .card-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    }
    .server-panel { display: flex; flex-direction: column; gap: 10px; }
    .server-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .server-label { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; color: var(--muted); min-width: 68px; }
    .pill {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 6px 12px; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px; transition: 0.15s;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pill.donghua-active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }
    .pill.reacted { background: rgba(46,213,115,0.2); border-color: var(--accent); color: var(--accent); transform: scale(1.04); }
    .pill-ext { border-color: rgba(46,213,115,0.4); color: var(--accent); }
    .srv-badge { font-size: 0.62rem; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.14); text-transform: uppercase; }

    .ad-zone {
      padding: 10px; border-radius: 10px; background: rgba(17,21,31,0.55);
      border: 1px dashed rgba(148,163,184,0.18); text-align: center; min-height: 60px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ad-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }

    .info-card { display: flex; gap: 14px; align-items: flex-start; }
    @media (max-width: 520px) { .info-card { flex-direction: column; } .info-card img { width: 92px; } }
    .info-card img { width: 105px; aspect-ratio: 2 / 3; object-fit: cover; object-position: center top; border-radius: 8px; flex-shrink: 0; }
    .info-card h1 { font-size: 1.2rem; line-height: 1.25; }
    .native-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .meta-line { font-size: 0.8rem; color: var(--accent); font-weight: 700; margin: 6px 0; }
    .desc-text { font-size: 0.84rem; color: #cbd5e1; }

    .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; }
    .ep-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 9px 4px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.84rem;
    }
    .ep-btn:hover, .ep-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .ep-btn.donghua-ep.active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }

    .comment-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    @media (max-width: 560px) { .comment-form { grid-template-columns: 1fr; } }
    .comment-form input {
      background: var(--surface-2); border: 1px solid var(--border); color: #fff;
      padding: 9px 11px; border-radius: 8px; font-size: 0.84rem; outline: none; width: 100%;
    }
    .comment-msg-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .comment-msg-row input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 0.84rem; outline: none; }

    /* Flying Emoji Animation */
    @keyframes flyEmoji {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 1; }
      100% { transform: translate(-50%, -110px) scale(1.7); opacity: 0; }
    }
    .flying-emoji {
      position: fixed; z-index: 999; pointer-events: none; font-size: 1.8rem;
      animation: flyEmoji 0.85s ease-out forwards;
    }

    footer {
      border-top: 1px solid var(--border); background: #06080c; padding: 20px 14px;
      text-align: center; font-size: 0.78rem; color: var(--muted); line-height: 1.7;
    }
    footer a { color: var(--accent); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">ANI<span>STREAM</span></a>
    <a href="index.html" class="back-btn">← Back to Catalog</a>
  </header>

  <div class="cinema-backdrop" onclick="toggleCinema(false)"></div>
  <div class="cinema-bar">
    <span class="cinema-title" id="cinema-now-playing">Cinema Mode</span>
    <button class="cinema-exit-btn" onclick="toggleCinema(false)">✕ Exit Cinema</button>
  </div>
  <div class="cinema-controls">
    <button class="pill" onclick="prevEpisode()">⏮ Prev</button>
    <button class="pill" onclick="nextEpisode()">Next ⏭</button>
    <button class="pill active" onclick="toggleCinema(false)">✕ Exit</button>
  </div>

  <main class="container">
    <!-- 1. IFRAME PLAYER WITH ANISTREAM BORDER -->
    <div class="player-shell">
      <div class="player-header">
        <span class="player-brand-tag">ANI<span>STREAM</span> HD PLAYER</span>
        <span id="player-ep-badge" style="color:var(--accent);">Episode 1</span>
      </div>
      <div class="video-wrap" id="video-wrap">
        <iframe id="player-frame" src="" title="AniStream Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
        <div id="artplayer-box" style="display:none;"></div>
      </div>
    </div>

    <!-- 2. SERVER / OFFICIAL / PLAYER CONTROLS -->
    <div class="card-box server-panel">
      <div class="server-row">
        <span class="server-label">Servers:</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;" id="server-pills"></div>
      </div>
      <div class="server-row" id="official-ext-row" style="display:none;">
        <span class="server-label">Official:</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;" id="ext-pills"></div>
      </div>
      <div class="server-row">
        <span class="server-label">Player:</span>
        <button class="pill" onclick="prevEpisode()">⏮ Prev</button>
        <button class="pill" onclick="nextEpisode()">Next ⏭</button>
        <button class="pill" onclick="toggleCinema(true)">🎬 Cinema</button>
        <button class="pill" id="autonext-btn" onclick="toggleAutoNext()">⏭ Auto-Next: ON</button>
        <button class="pill" style="border-color:rgba(46,213,115,0.45);color:#2ed573;" onclick="shareEpisode()">📤 Share</button>
        <button class="pill" style="border-color:rgba(56,189,248,0.45);color:#38bdf8;" onclick="openSourceApp()">📱 Open Source</button>
        <button class="pill" style="border-color:rgba(245,158,11,0.45);color:#fbbf24;" onclick="reportBrokenVideo()">⚠️ Report</button>
      </div>
    </div>

    <!-- 3. AD CONTAINER -->
    <div class="ad-zone">
      <span class="ad-label">Sponsored</span>
      <div id="container-1670e3305650d4a06781e47abce47301"></div>
    </div>

    <!-- 4. INFO CONTAINER -->
    <div class="card-box info-card">
      <img id="show-cover" src="" alt="Poster" />
      <div>
        <h1 id="show-title">Loading...</h1>
        <div class="native-sub" id="show-native"></div>
        <div class="meta-line" id="show-meta">Official Stream • 1080p</div>
        <p class="desc-text" id="show-desc"></p>
      </div>
    </div>

    <!-- 5. EPISODES CONTAINER -->
    <div class="card-box">
      <div class="ep-header">
        <strong>📺 Episodes</strong>
        <select id="ep-range" onchange="renderEpisodes()" style="background:var(--surface-2); color:var(--text); border:1px solid #2a344a; border-radius:6px; padding:5px 8px; font-size:0.8rem; font-weight:700;"></select>
      </div>
      <div class="ep-grid" id="ep-grid"></div>
    </div>

    <!-- 6. REACTION CONTAINER (1 PER PERSON + FLYING ANIMATION) -->
    <div class="card-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong>✨ Episode Reaction (Pick 1)</strong>
        <span id="ep-chat-label" style="font-size:0.78rem; color:var(--muted);">Episode 1</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;" id="reaction-bar">
        <button class="pill" data-react="fire" onclick="reactEp('fire','🔥',this)">🔥 Hyped (<span id="r-fire">0</span>)</button>
        <button class="pill" data-react="cry" onclick="reactEp('cry','😭',this)">😭 Emotional (<span id="r-cry">0</span>)</button>
        <button class="pill" data-react="mind" onclick="reactEp('mind','🤯',this)">🤯 Twist (<span id="r-mind">0</span>)</button>
        <button class="pill" data-react="fight" onclick="reactEp('fight','⚔️',this)">⚔️ Epic (<span id="r-fight">0</span>)</button>
        <button class="pill" data-react="laugh" onclick="reactEp('laugh','😂',this)">😂 Funny (<span id="r-laugh">0</span>)</button>
      </div>
    </div>

    <!-- 7. COMMENTS WITH NAME & EMAIL -->
    <div class="card-box">
      <strong style="display:block; margin-bottom:10px;">💬 Viewer Comments</strong>
      <div class="comment-form">
        <input id="comment-name" placeholder="Your Name *" />
        <input id="comment-email" type="email" placeholder="Your Email (kept private) *" />
      </div>
      <div class="comment-msg-row">
        <input id="comment-text" placeholder="Write your comment about this episode..." onkeydown="if(event.key==='Enter') postComment()" />
        <button class="pill active" onclick="postComment()">Post</button>
      </div>
      <div id="comments-list" style="display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;"></div>
    </div>
  </main>

  <!-- 8. FOOTER -->
  <footer>
    <div>
      <a href="index.html">Home</a> •
      <a href="https://aniguide.aniguide-hub.workers.dev" target="_blank" rel="noopener">Watch Orders</a> •
      <a href="#dmca" onclick="alert('DMCA: AniStream only embeds verified official streams.'); return false;">DMCA</a>
    </div>
    <p>Copyright © 2026 AniStream. All rights reserved.</p>
  </footer>

  <script>
    const ANISTREAM_DB = "https://anistream-community-default-rtdb.asia-southeast1.firebasedatabase.app";
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");
    let currentEp = Math.max(1, Number(params.get("ep")) || 1);
    let currentShow = null, activeServerIdx = 0, artInstance = null;
    let currentExternalUrl = "https://www.youtube.com";
    let autoNext = localStorage.getItem("anistream_autonext") !== "0";

    document.getElementById("autonext-btn").textContent = autoNext ? "⏭ Auto-Next: ON" : "⏭ Auto-Next: OFF";
    function escHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
    function toggleCinema(state) { document.body.classList.toggle("cinema", state); if (currentShow) document.getElementById("cinema-now-playing").textContent = `${currentShow.title} — Ep ${currentEp}`; }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleCinema(false); });
    function toggleAutoNext() { autoNext = !autoNext; localStorage.setItem("anistream_autonext", autoNext ? "1" : "0"); document.getElementById("autonext-btn").textContent = autoNext ? "⏭ Auto-Next: ON" : "⏭ Auto-Next: OFF"; }

    function getProviderType(srv) {
      if (!srv) return "youtube";
      if (srv.type) return srv.type.toLowerCase();
      if (/dailymotion/i.test(srv.name)) return "dailymotion";
      if (/rumble/i.test(srv.name)) return "rumble";
      if (/odysee/i.test(srv.name)) return "odysee";
      if (/mega/i.test(srv.name)) return "mega";
      if (/dtube/i.test(srv.name)) return "dtube";
      if (/sub|artplayer|plyr|vtt/i.test(srv.name)) return "artplayer";
      return "youtube";
    }

    function getMappedEntry(srv, ep) {
      if (!srv) return null;
      if (srv.episodeMap && srv.episodeMap[String(ep)] !== undefined) return srv.episodeMap[String(ep)];
      if (srv.episodeMap && Object.keys(srv.episodeMap).length > 0) return null;
      return (srv.videoIds || [])[ep - 1] || null;
    }

    async function resolveStreamSource(srv, ep) {
      const provider = getProviderType(srv), entry = getMappedEntry(srv, ep);
      if (provider === "youtube") {
        if (entry) return { mode: "iframe", embedUrl: `https://www.youtube.com/embed/${entry}?autoplay=1&rel=0&modestbranding=1&playsinline=1`, externalUrl: `https://www.youtube.com/watch?v=${entry}` };
        if (srv.playlistId) return { mode: "iframe", embedUrl: `https://www.youtube.com/embed/videoseries?list=${srv.playlistId}&index=${ep - 1}&rel=0&modestbranding=1&playsinline=1`, externalUrl: `https://www.youtube.com/playlist?list=${srv.playlistId}` };
        return null;
      }
      if (!entry) return null;
      if (provider === "dailymotion") { const id = typeof entry === "object" ? entry.id : entry; return { mode: "iframe", embedUrl: `https://geo.dailymotion.com/player.html?video=${id}&autoplay=1`, externalUrl: `https://www.dailymotion.com/video/${id}` }; }
      if (provider === "rumble") { const id = typeof entry === "object" ? entry.embedId : entry; return { mode: "iframe", embedUrl: `https://rumble.com/embed/${id}/`, externalUrl: `https://rumble.com/embed/${id}/` }; }
      if (provider === "odysee") { const p = typeof entry === "object" ? `${entry.claimName}/${entry.claimId}` : entry; return { mode: "iframe", embedUrl: `https://odysee.com/$/embed/${p}?r=1`, externalUrl: `https://odysee.com/${p}` }; }
      if (provider === "artplayer" || provider === "plyr") { return { mode: "artplayer", videoUrl: typeof entry === "object" ? entry.videoUrl : entry, subtitles: entry.subtitles || [], externalUrl: typeof entry === "object" ? entry.videoUrl : entry }; }
      if (provider === "mega") { const ref = typeof entry === "object" ? `${entry.fileId}#${entry.key}` : entry; return { mode: "iframe", embedUrl: `https://mega.nz/embed/${ref}`, externalUrl: `https://mega.nz/file/${ref}` }; }
      if (provider === "dtube") { const p = typeof entry === "object" ? `${entry.user}/${entry.permlink}` : entry; return { mode: "iframe", embedUrl: `https://emb.d.tube/#!/${p}`, externalUrl: `https://d.tube/#!/v/${p}` }; }
      return null;
    }

    async function renderArtplayer(videoUrl, subtitles) {
      const box = document.getElementById("artplayer-box");
      box.style.display = "block";
      if (artInstance) { artInstance.destroy(false); artInstance = null; }
      if (!window.Artplayer) {
        await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      }
      const def = subtitles.find(s => s.default) || subtitles[0];
      artInstance = new window.Artplayer({
        container: box, url: videoUrl, autoplay: true, setting: true, fullscreen: true,
        subtitle: def ? { url: def.url, type: "vtt", encoding: "utf-8" } : {}
      });
    }

    function openSourceApp() { window.open(currentExternalUrl, "_blank", "noopener"); }
    function shareEpisode() {
      if (!currentShow) return;
      const u = `${location.origin}/watch.html?id=${currentShow.slug}&ep=${currentEp}`;
      if (navigator.share) navigator.share({ title: `${currentShow.title} Ep ${currentEp}`, url: u }).catch(() => {});
      else { navigator.clipboard?.writeText(u); alert("Copied: " + u); }
    }

    async function reportBrokenVideo() {
      if (!currentShow) return;
      const r = prompt(`Report ${currentShow.title} Ep ${currentEp}?`, "Video unavailable");
      if (!r) return;
      await fetch(`${ANISTREAM_DB}/anistream_reports.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: currentShow.slug, title: currentShow.title, ep: currentEp, reason: r.slice(0, 200), time: new Date().toLocaleString() }) }).catch(() => {});
      alert("Report sent!");
    }

    function saveHistory() {
      if (!currentShow) return;
      const srv = (currentShow.servers || [])[activeServerIdx] || {};
      let h = JSON.parse(localStorage.getItem("anistream_history") || "[]").filter(i => i.slug !== currentShow.slug);
      h.unshift({ slug: currentShow.slug, title: currentShow.title, cover: currentShow.cover, episode: currentEp, track: srv.lang || "HD" });
      localStorage.setItem("anistream_history", JSON.stringify(h.slice(0, 12)));
    }

    async function playEpisode(ep) {
      if (!currentShow) return;
      currentEp = ep;
      document.getElementById("player-ep-badge").textContent = `Episode ${ep}`;
      const srv = (currentShow.servers || [])[activeServerIdx];
      const frame = document.getElementById("player-frame"), artBox = document.getElementById("artplayer-box");
      let notice = document.getElementById("licensed-overlay");

      const resolved = srv ? await resolveStreamSource(srv, ep) : null;
      if (!resolved) {
        if (frame) { frame.src = "about:blank"; frame.style.display = "none"; }
        if (artBox) artBox.style.display = "none";
        if (!notice) {
          notice = document.createElement("div");
          notice.id = "licensed-overlay";
          notice.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0f172a;color:#f1f5f9;gap:10px;z-index:5;";
          frame.parentElement.appendChild(notice);
        }
        const epMap = srv?.episodeMap || {};
        const keys = Object.keys(epMap).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
        const btn = keys.length ? `<button class="pill active" onclick="playEpisode(${keys[0]})">▶ Play Ep ${keys[0]}</button>` : "";
        notice.innerHTML = `<div style="font-weight:800;">⚠️ Episode ${ep} Unavailable on this server</div><div style="font-size:0.8rem;color:#94a3b8;">Try switching servers below or jump to an available episode.</div>${btn}`;
        notice.style.display = "flex";
      } else {
        if (notice) notice.style.display = "none";
        currentExternalUrl = resolved.externalUrl;
        if (resolved.mode === "artplayer") {
          frame.src = "about:blank"; frame.style.display = "none";
          await renderArtplayer(resolved.videoUrl, resolved.subtitles);
        } else {
          artBox.style.display = "none";
          if (artInstance) { artInstance.destroy(false); artInstance = null; }
          frame.style.display = "block"; frame.src = resolved.embedUrl;
        }
      }
      document.title = `Watch ${currentShow.title} Ep ${currentEp} — AniStream`;
      saveHistory(); renderEpisodes(); loadEpisodeSocial();
    }

    function prevEpisode() { if (currentEp > 1) playEpisode(currentEp - 1); }
    function nextEpisode() { if (currentShow && currentEp < currentShow.episodes) playEpisode(currentEp + 1); }

    function renderServers() {
      const box = document.getElementById("server-pills"), isD = currentShow.type === "donghua";
      box.innerHTML = (currentShow.servers || []).map((srv, idx) => {
        const cls = idx === activeServerIdx ? (isD ? "donghua-active" : "active") : "";
        return `<button class="pill ${cls}" onclick="switchServer(${idx})">▶ ${escHtml(srv.name)} <span class="srv-badge">${getProviderType(srv)}</span></button>`;
      }).join("");
      const ext = currentShow.officialLinks || [];
      if (ext.length) {
        document.getElementById("official-ext-row").style.display = "flex";
        document.getElementById("ext-pills").innerHTML = ext.map(l => `<a class="pill pill-ext" href="${l.url}" target="_blank" rel="noopener">↗ ${l.site}</a>`).join("");
      }
    }
    function switchServer(idx) { activeServerIdx = idx; renderServers(); initRanges(); playEpisode(currentEp); }

    function initRanges() {
      const sel = document.getElementById("ep-range"), total = currentShow.episodes || 24;
      let opts = "";
      for (let s = 1; s <= total; s += 50) {
        const e = Math.min(total, s + 49);
        opts += `<option value="${s}-${e}" ${(currentEp >= s && currentEp <= e) ? "selected" : ""}>${s}–${e} (${total})</option>`;
      }
      sel.innerHTML = opts;
    }

    function renderEpisodes() {
      const grid = document.getElementById("ep-grid"), isD = currentShow.type === "donghua";
      const [start, end] = (document.getElementById("ep-range").value || `1-${Math.min(50, currentShow.episodes)}`).split("-").map(Number);
      const map = ((currentShow.servers || [])[activeServerIdx] || {}).episodeMap;
      const hasMap = map && Object.keys(map).length > 0;
      let html = "";
      for (let i = start; i <= end; i++) {
        const vip = hasMap && !map[String(i)] ? 'style="opacity:0.4;"' : '';
        html += `<button class="ep-btn ${isD ? "donghua-ep" : ""} ${i === currentEp ? "active" : ""}" ${vip} onclick="playEpisode(${i})">${i}</button>`;
      }
      grid.innerHTML = html;
    }

    function epKey() { return `${currentShow ? currentShow.slug : "show"}_ep${currentEp}`; }

    function spawnFlyingEmoji(emoji, btnEl) {
      const rect = btnEl.getBoundingClientRect();
      const span = document.createElement("span");
      span.className = "flying-emoji";
      span.textContent = emoji;
      span.style.left = (rect.left + rect.width / 2) + "px";
      span.style.top = rect.top + "px";
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 900);
    }

    function highlightMyReaction() {
      const myKey = localStorage.getItem("anistream_react_" + epKey());
      document.querySelectorAll("#reaction-bar .pill").forEach(b => b.classList.toggle("reacted", b.dataset.react === myKey));
    }

    async function loadEpisodeSocial() {
      document.getElementById("ep-chat-label").textContent = `Episode ${currentEp}`;
      try {
        const data = (await (await fetch(`${ANISTREAM_DB}/anistream_episodes/${epKey()}.json`)).json()) || {};
        const r = data.reactions || {};
        ["fire", "cry", "mind", "fight", "laugh"].forEach(k => { document.getElementById("r-" + k).textContent = r[k] || 0; });
        highlightMyReaction();
        const comments = Object.values(data.comments || {}).reverse();
        document.getElementById("comments-list").innerHTML = comments.length
          ? comments.map(c => `<div style="background:var(--surface-2);padding:9px 11px;border-radius:8px;font-size:0.82rem;"><strong style="color:var(--accent);">${escHtml(c.name)}</strong> <span style="color:var(--muted);font-size:0.7rem;">• ${escHtml(c.time)}</span><div style="margin-top:2px;">${escHtml(c.text)}</div></div>`).join("")
          : `<div style="color:var(--muted);font-size:0.8rem;">Be the first to comment on Episode ${currentEp}!</div>`;
      } catch (e) {}
    }

    async function reactEp(k, emoji, btnEl) {
      const storeKey = "anistream_react_" + epKey();
      const prev = localStorage.getItem(storeKey);
      if (prev === k) {
        // Toggle off same reaction
        localStorage.removeItem(storeKey);
        const curEl = document.getElementById("r-" + k);
        const nv = Math.max(0, (parseInt(curEl.textContent, 10) || 0) - 1);
        curEl.textContent = nv;
        highlightMyReaction();
        await fetch(`${ANISTREAM_DB}/anistream_episodes/${epKey()}/reactions/${k}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(nv) }).catch(() => {});
        return;
      }
      // Remove previous reaction if user picked a different one
      if (prev) {
        const prevEl = document.getElementById("r-" + prev);
        const pv = Math.max(0, (parseInt(prevEl.textContent, 10) || 0) - 1);
        prevEl.textContent = pv;
        fetch(`${ANISTREAM_DB}/anistream_episodes/${epKey()}/reactions/${prev}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pv) }).catch(() => {});
      }
      // Add new reaction + flying emoji animation
      localStorage.setItem(storeKey, k);
      const el = document.getElementById("r-" + k);
      const nv = (parseInt(el.textContent, 10) || 0) + 1;
      el.textContent = nv;
      highlightMyReaction();
      spawnFlyingEmoji(emoji, btnEl);
      await fetch(`${ANISTREAM_DB}/anistream_episodes/${epKey()}/reactions/${k}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(nv) }).catch(() => {});
    }

    async function postComment() {
      const name = document.getElementById("comment-name").value.trim().slice(0, 35);
      const email = document.getElementById("comment-email").value.trim().slice(0, 80);
      const inp = document.getElementById("comment-text");
      const text = inp.value.trim().slice(0, 300);
      if (!name || !email || !text) { alert("Please enter your Name, Email, and Comment."); return; }
      inp.value = "";
      await fetch(`${ANISTREAM_DB}/anistream_episodes/${epKey()}/comments.json`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, text, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) })
      }).catch(() => {});
      loadEpisodeSocial();
    }

    fetch("data/catalog.json").then(r => r.json()).then(list => {
      const playable = list.filter(x => (x.servers || []).length > 0);
      const found = slug ? playable.find(x => x.slug === slug) : playable[0];
      if (!found) { location.replace("index.html"); return; }
      currentShow = found;
      document.getElementById("show-cover").src = currentShow.cover;
      document.getElementById("show-title").textContent = `${currentShow.title} (${currentShow.year})`;
      document.getElementById("show-native").textContent = currentShow.nativeTitle ? `Original: ${currentShow.nativeTitle}` : "";
      document.getElementById("show-meta").textContent = `${currentShow.quality || "1080p"} Official • ★ ${(currentShow.score / 10).toFixed(1)} • ${currentShow.episodes} Episodes`;
      document.getElementById("show-desc").textContent = currentShow.desc;
      renderServers(); initRanges(); playEpisode(currentEp);
    });

    setTimeout(() => {
      const s = document.createElement("script");
      s.async = true; s.setAttribute("data-cfasync", "false");
      s.src = "https://bauval.org/21/1670e3305650d4a06781e47abce47301";
      document.body.appendChild(s);
    }, 1000);
  </script>
  <script data-cfasync="false" src="https://bauval.org/14/e2908a73c63d8d2754e40ea99e7cdbda"></script>
</body>
</html>
