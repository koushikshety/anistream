<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Free Official Anime & Donghua HD — AniStream</title>
  <style>
    :root {
      --bg: #080a0f; --surface: #11151f; --surface-2: #181e2c; --border: #1e2638;
      --primary: #ff4757; --donghua: #f59e0b; --accent: #2ed573;
      --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: rgba(8,10,15,0.94); border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 1.3rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .brand span { color: var(--primary); }
    .back-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600;
    }
    .container { max-width: 1340px; margin: 0 auto; padding: 16px 20px 56px; }
    .watch-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 920px) { .watch-grid { grid-template-columns: 1fr; } }

    .video-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* Multi-Server & Controls Panel */
    .server-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; margin-top: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .server-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .server-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--muted); min-width: 72px; }
    .pill {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pill.donghua-active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }
    .pill-ext { border-color: rgba(46,213,115,0.4); color: var(--accent); }

    /* Safe Non-Overlapping Ad Slot Below Controls */
    .ad-zone {
      margin: 18px 0; padding: 10px; border-radius: 10px;
      background: rgba(17,21,31,0.55); border: 1px dashed rgba(148,163,184,0.18);
      text-align: center; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ad-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }

    .info-card {
      display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .info-card img { width: 100px; aspect-ratio: 2 / 3; object-fit: cover; object-position: center top; border-radius: 8px; flex-shrink: 0; }
    .info-card h1 { font-size: 1.25rem; line-height: 1.25; }
    .native-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .meta-line { font-size: 0.82rem; color: var(--accent); font-weight: 700; margin: 6px 0; }
    .desc-text { font-size: 0.86rem; color: #cbd5e1; }

    .ep-sidebar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; max-height: 600px; overflow-y: auto;
    }
    .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ep-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ep-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid #2a344a;
      padding: 10px 4px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
    }
    .ep-btn:hover, .ep-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .ep-btn.donghua-ep.active { background: var(--donghua); border-color: var(--donghua); color: #080a0f; }

    body.cinema::before {
      content: ""; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 40; pointer-events: none;
    }
    body.cinema .video-wrap { z-index: 50; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">ANI<span>STREAM</span></a>
    <a href="index.html" class="back-btn">← All Catalog</a>
  </header>

  <main class="container">
    <div class="watch-grid">
      <div>
        <div class="video-wrap">
          <iframe
            id="player-frame"
            src=""
            title="Official Stream Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="server-panel">
          <div class="server-row">
            <span class="server-label">Servers:</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;" id="server-pills"></div>
          </div>
          <div class="server-row" id="official-ext-row" style="display:none;">
            <span class="server-label">Official:</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;" id="ext-pills"></div>
          </div>
          <div class="server-row">
            <span class="server-label">Player:</span>
            <button class="pill" onclick="prevEpisode()">⏮ Prev</button>
            <button class="pill" onclick="nextEpisode()">Next ⏭</button>
            <button class="pill" onclick="document.body.classList.toggle('cinema')">Cinema Mode</button>
          </div>
        </div>

        <!-- Safe Adsterra Slot (Zero iframe overlap) -->
        <div class="ad-zone">
          <span class="ad-label">Sponsored</span>
          <div id="container-adsterra-watch"></div>
        </div>

        <div class="info-card">
          <img id="show-cover" src="" alt="Poster" />
          <div>
            <h1 id="show-title">Loading...</h1>
            <div class="native-sub" id="show-native"></div>
            <div class="meta-line" id="show-meta">Official Stream • 1080p</div>
            <p class="desc-text" id="show-desc"></p>
          </div>
        </div>
      </div>

      <aside class="ep-sidebar">
        <div class="ep-header">
          <strong>Episodes</strong>
          <span id="ep-total" style="color:var(--muted); font-size:0.82rem;"></span>
        </div>
        <div class="ep-grid" id="ep-grid"></div>
      </aside>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");
    let currentEp = Math.max(1, Number(params.get("ep")) || 1);
    let currentShow = null;
    let activeServerIdx = 0;

    function saveHistory() {
      if (!currentShow) return;
      const srv = currentShow.servers[activeServerIdx] || {};
      let history = JSON.parse(localStorage.getItem("anistream_history") || "[]");
      history = history.filter(item => item.slug !== currentShow.slug);
      history.unshift({
        slug: currentShow.slug,
        title: currentShow.title,
        cover: currentShow.cover,
        episode: currentEp,
        track: srv.lang || "HD"
      });
      localStorage.setItem("anistream_history", JSON.stringify(history.slice(0, 12)));
    }

    function playEpisode(ep) {
      if (!currentShow) return;
      currentEp = ep;
      const srv = currentShow.servers[activeServerIdx];
      if (!srv) return;
      const url = `https://www.youtube-nocookie.com/embed/videoseries?list=${srv.playlistId}&index=${ep - 1}&rel=0&modestbranding=1`;
      document.getElementById("player-frame").src = url;
      saveHistory();
      renderEpisodes();
    }

    function prevEpisode() { if (currentEp > 1) playEpisode(currentEp - 1); }
    function nextEpisode() { if (currentShow && currentEp < currentShow.episodes) playEpisode(currentEp + 1); }

    function renderServers() {
      const box = document.getElementById("server-pills");
      const isDonghua = currentShow.type === "donghua";
      box.innerHTML = (currentShow.servers || []).map((srv, idx) => {
        const activeClass = idx === activeServerIdx ? (isDonghua ? "donghua-active" : "active") : "";
        return `<button class="pill ${activeClass}" onclick="switchServer(${idx})">▶ ${srv.name}</button>`;
      }).join("");

      const extLinks = currentShow.officialLinks || [];
      if (extLinks.length) {
        document.getElementById("official-ext-row").style.display = "flex";
        document.getElementById("ext-pills").innerHTML = extLinks.map(l =>
          `<a class="pill pill-ext" href="${l.url}" target="_blank" rel="noopener">↗ ${l.site}</a>`
        ).join("");
      }
    }

    function switchServer(idx) {
      activeServerIdx = idx;
      renderServers();
      playEpisode(currentEp);
    }

    function renderEpisodes() {
      const grid = document.getElementById("ep-grid");
      const isDonghua = currentShow.type === "donghua";
      document.getElementById("ep-total").textContent = `${currentShow.episodes} Eps`;
      let html = "";
      for (let i = 1; i <= currentShow.episodes; i++) {
        const active = i === currentEp ? "active" : "";
        html += `<button class="ep-btn ${isDonghua ? "donghua-ep" : ""} ${active}" onclick="playEpisode(${i})">${i}</button>`;
      }
      grid.innerHTML = html;
    }

    fetch("data/catalog.json").then(r => r.json()).then(list => {
      currentShow = list.find(x => x.slug === slug) || list[0];
      document.title = `Watch ${currentShow.title} (${currentShow.year}) Free HD — AniStream`;
      document.getElementById("show-cover").src = currentShow.cover;
      document.getElementById("show-title").textContent = `${currentShow.title} (${currentShow.year})`;
      document.getElementById("show-native").textContent = currentShow.nativeTitle ? `Original Title: ${currentShow.nativeTitle}` : "";
      document.getElementById("show-meta").textContent = `${currentShow.quality} Official • ★ ${(currentShow.score / 10).toFixed(1)} • ${currentShow.episodes} Episodes`;
      document.getElementById("show-desc").textContent = currentShow.desc;
      renderServers();
      playEpisode(currentEp);
    });
  </script>
</body>
</html>
